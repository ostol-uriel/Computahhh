<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Deadline Guardian</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="app-header">
    <h1>Deadline Guardian</h1>
    <button id="settingsToggle" class="icon-btn" title="Settings" aria-label="Settings">&#9881;</button>
  </header>

  <section id="settingsPanel" class="settings-panel hidden">
    <label for="canvasUrl">Canvas URL</label>
    <input
      type="url"
      id="canvasUrl"
      placeholder="https://canvas.instructure.com"
      autocomplete="off"
    />

    <label for="apiToken">API Token</label>
    <input
      type="password"
      id="apiToken"
      placeholder="Personal access token"
      autocomplete="off"
    />

    <div class="settings-actions">
      <button id="saveSettings" class="primary">Save</button>
      <button id="clearSettings" class="ghost">Clear</button>
    </div>
    <p class="hint">
      Get a token from Canvas: Account &rarr; Settings &rarr; New Access Token.
    </p>
  </section>

  <section class="toolbar">
    <button id="syncBtn" class="primary full-width">Sync</button>
    <p id="lastSync" class="last-sync"></p>
  </section>

  <section id="status" class="status hidden"></section>

  <!-- Tab Navigation -->
  <nav class="tabs-nav">
    <button id="tab1Btn" class="tab-btn active" data-tab="1">📋 Assignments</button>
    <button id="tab2Btn" class="tab-btn" data-tab="2">🔔 Notifications</button>
  </nav>

  <!-- Page 1: Assignments -->
  <main id="page1" class="tab-page active">
    <!-- Summary Cards -->
    <div class="summary-cards">
      <div class="summary-card due-today">
        <div class="summary-number" id="dueTodayCount">0</div>
        <div class="summary-label">Due Today</div>
      </div>
      <div class="summary-card due-week">
        <div class="summary-number" id="dueWeekCount">0</div>
        <div class="summary-label">This Week</div>
      </div>
      <div class="summary-card overdue">
        <div class="summary-number" id="overdueCount">0</div>
        <div class="summary-label">Overdue</div>
      </div>
    </div>

    <!-- Filter Buttons -->
    <div class="filter-buttons">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="today">Today</button>
      <button class="filter-btn" data-filter="week">This Week</button>
      <button class="filter-btn" data-filter="overdue">Overdue</button>
    </div>

    <!-- Deadlines List -->
    <div id="deadlineContainer" class="deadline-container">
      <ul id="deadlineList" class="deadline-list"></ul>
      <p id="emptyState" class="empty-state hidden">
        No upcoming deadlines. Click <strong>Sync Deadlines</strong> to fetch from Canvas.
      </p>
    </div>
  </main>

  <!-- Page 2: Notifications & Announcements -->
  <main id="page2" class="tab-page hidden">
    <div id="announcementsList" class="announcements-list"></div>
    <p id="emptyAnnouncements" class="empty-state hidden">
      No announcements yet.
    </p>
  </main>

  <script src="popup.js"></script>
</body>
</html>
